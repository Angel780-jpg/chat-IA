<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aria</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <section class="portrait-panel">
        <div class="character">
          <img src="img/feliz.jpg" alt="Aria feliz" class="expresion feliz" />
          <img
            src="img/enojada.jpg"
            alt="Aria enojada"
            class="expresion enojada"
          />
          <img
            src="img/triste.jpg"
            alt="Aria triste"
            class="expresion triste"
          />
          <img
            src="img/neutral.jpg"
            alt="Aria neutral"
            class="expresion neutral"
          />
        </div>
        <p class="char-name">Aria</p>
        <p class="mood-label" id="moodLabel">tranquila</p>
      </section>

      <section class="chat-panel">
        <div class="messages" id="messages"></div>

        <form id="chatForm">
          <input
            type="text"
            id="usertext"
            placeholder="Escribe algo..."
            autocomplete="off"
            required
          />
          <button type="submit" id="sendButton">
            <img src="img/enviar.png" alt="Enviar" />
          </button>
        </form>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
